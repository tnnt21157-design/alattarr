{% extends "base.html" %}
{% block title %}دخول الأدمن{% endblock %}
{% block content %}
<div class="login-box">
    <h2>🔐 لوحة التحكم</h2>
    <form method="POST">
        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" name="username" required class="form-control" autofocus>
        </div>
        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" name="password" required class="form-control">
        </div>
        <button type="submit" class="btn" style="width:100%; padding:12px; margin-top:8px;">دخول</button>
    </form>
</div>
{% endblock %}
